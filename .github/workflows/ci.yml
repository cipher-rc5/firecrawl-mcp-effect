name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Install dependencies
        run: bun install

      - name: Format check
        run: bun run fmt:check

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Coverage
        run: bun run test:coverage

      - name: Smoke checks
        run: bun run smoke
